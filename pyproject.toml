[project]
name = "4r-chatbot"
version = "0.1.0"
description = "4R Çevre destek chatbot — RAG + yapısal atık kodu sorgusu (web + WhatsApp)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = [
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
