[project]
name = "4r-chatbot"
version = "0.2.0"
description = "4R Çevre destek chatbot — tam bağlam + yapısal atık kodu sorgusu (web + WhatsApp)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Site içeriğini yeniden çekmek ve xlsx yüklemek için (sunucuda çalışmak zorunda değil).
ingest = [
    "openpyxl>=3.1",
    "trafilatura>=1.12",
]
# Anthropic'e geçilirse (LLM_PROVIDER=anthropic).
anthropic = [
    "anthropic>=0.40",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# Depends()/Query() argüman varsayılanında çağrılmak FastAPI'nin standart kalıbı;
# B008 burada yanlış alarm veriyor.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
