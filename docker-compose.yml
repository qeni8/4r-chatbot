services:
  db:
    image: pgvector/pgvector:pg16
    container_name: 4r_chatbot_db
    environment:
      POSTGRES_USER: 4r
      POSTGRES_PASSWORD: 4r_dev_pw
      POSTGRES_DB: 4r_chatbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 4r -d 4r_chatbot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
